<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jocul Meu Online - Prinde Căsuța</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Prinde Căsuța!</h1>
        <div class="info-panel">
            <p>Scor: <span id="score">0</span></p>
            <p>Timp rămas: <span id="time">30</span>s</p>
        </div>
        
        <div id="game-board" class="game-board">
            <!-- Aici va apărea căsuța (pătratul) -->
        </div>
        
        <button id="start-btn">Începe Jocul</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
